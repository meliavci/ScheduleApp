name: Build Final Report (PDF & DOCX)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: pandoc/extra:latest

    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Styling Config
        run: |
          cat <<EOF > header.tex
          \usepackage[T1]{fontenc}
          \usepackage{helvet}
          \renewcommand{\familydefault}{\sfdefault}
          \usepackage{xcolor}
          \usepackage{scrlayer-scrpage}
          \clearpairofpagestyles
          \ihead{} 
          \ohead{}
          \ifoot{\textcolor{gray}{ScheduleApp Final Report}}
          \ofoot{\thepage}
          \setkomafont{pageheadfoot}{\small\sffamily}
          \usepackage{booktabs}
          \usepackage{tabularx}
          \usepackage{ltablex}
          \keepXColumns
          \renewcommand{\arraystretch}{1.4}
          \usepackage{float}
          \let\origfigure\figure
          \let\endorigfigure\endfigure
          \renewenvironment{figure}[1][2] {
              \expandafter\origfigure\expandafter[H]
          } {
              \endorigfigure
          }
          \usepackage[labelfont=bf, textfont={it}, font=small]{caption}
          EOF

      - name: Sanitize Markdown
        run: |
          mkdir -p assignments_clean
          cp assignments/*.md assignments_clean/
          sed -i 's/[\d128-\d255]//g' assignments_clean/*.md || true

      - name: Build DOCX
        run: |
          mkdir -p build
          pandoc \
            assignments/assignment-01.md \
            assignments/assignment-02.md \
            assignments/assignment-03.md \
            assignments/assignment-04.md \
            final/reflection.md \
            --metadata-file=meta.yaml \
            --resource-path=.:assets:assignments \
            --toc --toc-depth=2 --number-sections \
            -o build/final-report.docx

      - name: Build PDF
        run: |
          pandoc \
            assignments_clean/assignment-01.md \
            assignments_clean/assignment-02.md \
            assignments_clean/assignment-03.md \
            assignments_clean/assignment-04.md \
            final/reflection.md \
            --metadata-file=meta.yaml \
            --resource-path=.:assets:assignments \
            --pdf-engine=xelatex \
            --toc --toc-depth=2 --number-sections \
            -V documentclass=scrartcl \
            -V papersize=a4 \
            -V lang=de \
            -V geometry:top=2.5cm,bottom=3cm,left=2.5cm,right=2.5cm \
            -H header.tex \
            --verbose \
            -o build/final-report.pdf

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: build/
