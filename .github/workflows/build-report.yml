name: Build Final Report (PDF & DOCX)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: pandoc/extra:latest

    defaults:
      run:
        shell: sh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity checks
        run: |
          test -f meta.yaml
          test -f assignments/assignment-01.md
          test -f assignments/assignment-02.md
          test -f assignments/assignment-03.md
          test -f assignments/assignment-04.md
          test -f final/reflection.md

      - name: Download Eisvogel Template
        run: |
          wget https://raw.githubusercontent.com/Wandmalfarbe/pandoc-latex-template/v2.4.0/eisvogel.tex -O eisvogel.latex

      - name: Create Patch for Pandoc 3.x
        run: |
          # 1. Fix "\pandocbounded" error
          echo '\providecommand{\pandocbounded}[1]{#1}' > pandoc-patch.tex
          # 2. Fix "No counter 'none' defined" error in tables
          echo '\newcounter{none}' >> pandoc-patch.tex
          # 3. Ensure 'calc' package is loaded for table width calculations
          echo '\usepackage{calc}' >> pandoc-patch.tex

      - name: Build DOCX
        run: |
          mkdir -p build
          pandoc \
            assignments/assignment-01.md \
            assignments/assignment-02.md \
            assignments/assignment-03.md \
            assignments/assignment-04.md \
            final/reflection.md \
            --metadata-file=meta.yaml \
            --resource-path=.:assets:assignments \
            --toc --toc-depth=2 --number-sections \
            -o build/final-report.docx

      - name: Build PDF
        run: |
          pandoc \
            assignments/assignment-01.md \
            assignments/assignment-02.md \
            assignments/assignment-03.md \
            assignments/assignment-04.md \
            final/reflection.md \
            --metadata-file=meta.yaml \
            --resource-path=.:assets:assignments \
            --pdf-engine=xelatex \
            --template=./eisvogel.latex \
            --include-in-header=pandoc-patch.tex \
            --listings \
            --toc --toc-depth=2 --number-sections \
            -V book=true \
            -V classoption=oneside \
            -V geometry:margin=2.5cm \
            -V titlepage=true \
            -V titlepage-color=3E4349 \
            -V titlepage-text-color=FFFFFF \
            -V titlepage-rule-height=0 \
            -V toc-own-page=true \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V urlcolor=blue \
            -V float-placement-figure=H \
            -o build/final-report.pdf

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: build/
          if-no-files-found: error
